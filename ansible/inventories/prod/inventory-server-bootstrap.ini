# Quryltai single-server deployment — one Hetzner box hosts the whole app.
# Reached over the Tailscale tailnet.
[application]
quryltai-server ansible_host=quryltai-server

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=../.secrets/hetzner_deploy
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
