plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'org.jooq.jooq-codegen-gradle' version '3.19.35'
}

group = 'kz.quryltai'
version = '0.0.1-SNAPSHOT'
description = 'Quryltai 2026 backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.flywaydb:flyway-core'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    jooqCodegen 'org.jooq:jooq-meta-extensions:3.19.35'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                includes = 'candidate|candidate_content|candidate_photo|candidate_source|candidate_source_localization|party_program_measurement|party_program_statement_type|party_program_topic|place|political_party|source'
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/migration/*.sql'
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                    property {
                        key = 'unqualifiedSchema'
                        value = 'none'
                    }
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                }
            }
            generate {
                deprecated = false
                records = true
                pojos = false
                daos = false
                implicitJoinPathsToOne = false
                implicitJoinPathsToMany = false
            }
            target {
                packageName = 'kz.quryltai.backend.jooq'
                directory = 'build/generated-src/jooq/main'
            }
        }
    }
}

sourceSets {
    main {
        java.srcDir 'build/generated-src/jooq/main'
    }
}

tasks.named('jooqCodegen') {
    inputs.files(fileTree('src/main/resources/db/migration'))
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('importContent', JavaExec) {
    group = 'application'
    description = 'Validates and optionally imports Git-managed candidate content.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'kz.quryltai.backend.QuryltaiBackendApplication'
    args '--spring.main.web-application-type=none',
            '--content.import.enabled=true',
            "--content.import.dry-run=${providers.gradleProperty('contentDryRun').getOrElse('true')}"
    if (providers.gradleProperty('contentSourceRevision').isPresent()) {
        args "--content.import.source-revision=${providers.gradleProperty('contentSourceRevision').get()}"
    }
    if (providers.gradleProperty('contentDirectory').isPresent()) {
        args "--content.import.directory=${providers.gradleProperty('contentDirectory').get()}"
    }
}
