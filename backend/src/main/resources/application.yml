spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: quryltai-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

assets:
  base-url: ${ASSETS_BASE_URL:https://assets.open-quryltai.org}

content:
  import:
    enabled: ${CONTENT_IMPORT_ENABLED:false}
    dry-run: ${CONTENT_IMPORT_DRY_RUN:true}
    directory: ${CONTENT_DIRECTORY:../data/content}
    source-revision: ${CONTENT_SOURCE_REVISION:}
