---
# Single-server UFW firewall + fail2ban.
# Default deny incoming / allow outgoing; open SSH, HTTP, HTTPS, and the
# Tailscale interface. SSH rule is added BEFORE enabling UFW to avoid lockout.
- name: Install UFW and fail2ban
  apt:
    name:
      - ufw
      - fail2ban
    state: present
    update_cache: yes

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# SSH is reached only over the Tailscale interface (allowed below), so the
# public port 22 is closed. Delete any pre-existing public allow rule.
- name: Remove public SSH allow rule (SSH is tailnet-only)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: yes

# Only 443 is exposed publicly (Cloudflare fronts the origin over HTTPS).
# Port 80 is not needed at the origin; remove any pre-existing rule.
- name: Remove public HTTP allow rule (443 only)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    delete: yes

- name: Allow HTTPS (port 443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow all traffic on the Tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Allow Tailscale WireGuard UDP (direct connections)
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Ensure fail2ban is running and enabled
  service:
    name: fail2ban
    state: started
    enabled: true
