<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" fill="none" />

  <!-- Ballot voting square border -->
  <rect x="13" y="13" width="38" height="38" rx="8" stroke="url(#boxGrad)" stroke-width="3.5" stroke-opacity="0.75" fill="#0369a1" fill-opacity="0.4" />

  <!-- Election voting checkmark (starts inside, swoops down, extends upwards) -->
  <path
    d="M21 32.5 L28.5 41 L47 18"
    stroke="url(#checkGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />
  <path
    d="M21 32.5 L28.5 41 L47 18"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />
</svg>