---
# Apply the firewall role on its own (e.g. after bootstrap/hardening).
# Run as the deploy user (root login is disabled post-hardening):
#     ansible-playbook -i inventories/prod/inventory-server-bootstrap.ini \
#       firewall.yml -u "$ANSIBLE_USERNAME" --become --ask-become-pass
- name: Configure firewall
  hosts: all
  become: yes
  roles:
    - firewall
