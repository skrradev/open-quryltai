plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'org.jooq.jooq-codegen-gradle' version '3.19.35'
}

group = 'kz.quryltai'
version = '0.0.1-SNAPSHOT'
description = 'Quryltai 2026 backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.flywaydb:flyway-core'

    jooqCodegen 'org.jooq:jooq-meta-extensions:3.19.35'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

jooq {
    configuration {
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                includes = 'candidate|place|political_party'
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/migration/*.sql'
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                    property {
                        key = 'unqualifiedSchema'
                        value = 'none'
                    }
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                }
            }
            generate {
                deprecated = false
                records = true
                pojos = false
                daos = false
                implicitJoinPathsToOne = false
                implicitJoinPathsToMany = false
            }
            target {
                packageName = 'kz.quryltai.backend.jooq'
                directory = 'build/generated-src/jooq/main'
            }
        }
    }
}

sourceSets {
    main {
        java.srcDir 'build/generated-src/jooq/main'
    }
}

tasks.named('jooqCodegen') {
    inputs.files(fileTree('src/main/resources/db/migration'))
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('test') {
    useJUnitPlatform()
}
