---
# Deploy a new backend jar (build artifact) to the already-provisioned service.
# Provision first with java-service.yml. Build the jar locally, e.g.:
#     (cd ../backend && ./gradlew bootJar)
# Then:
#     ansible-playbook -i inventories/prod/inventory-server-bootstrap.ini \
#       deploy-backend.yml -u "$ANSIBLE_USERNAME" --become --ask-become-pass
#
# Override the jar path with -e backend_jar_src=/path/to/app.jar if needed.
- name: Deploy backend jar
  hosts: all
  become: yes
  vars:
    java_service_name: quryltai-backend
    java_service_base_dir: "/opt/{{ java_service_name }}"
    java_service_user: "{{ java_service_name }}"
    java_service_group: "{{ java_service_name }}"
    java_service_jar_name: app.jar
    pg_app_db_name: quryltai_db
    pg_app_user: quryltai_app
    backend_jar_src: "{{ lookup('env', 'BACKEND_JAR') | default(playbook_dir + '/../backend/build/libs/quryltai-backend-0.0.1-SNAPSHOT.jar', true) }}"
    content_source_dir: "{{ playbook_dir }}/../data/content"
    content_dest_dir: "{{ java_service_base_dir }}/content"
    content_source_revision: "{{ lookup('env', 'CONTENT_SOURCE_REVISION') | default(lookup('pipe', 'git rev-parse HEAD'), true) }}"

  tasks:
    - name: Assert the built jar exists locally
      delegate_to: localhost
      become: no
      stat:
        path: "{{ backend_jar_src }}"
      register: local_jar

    - name: Fail if the jar is missing
      fail:
        msg: "Jar not found at {{ backend_jar_src }} — run './gradlew bootJar' in backend/ first (or pass -e backend_jar_src=...)."
      when: not local_jar.stat.exists

    - name: Assert the content manifest exists locally
      delegate_to: localhost
      become: no
      stat:
        path: "{{ content_source_dir }}/manifest.json"
      register: local_content_manifest

    - name: Fail if the content manifest is missing
      fail:
        msg: "Content manifest not found at {{ content_source_dir }}/manifest.json."
      when: not local_content_manifest.stat.exists

    - name: Check for a currently deployed jar
      stat:
        path: "{{ java_service_base_dir }}/{{ java_service_jar_name }}"
      register: current_jar

    - name: Back up the current jar
      copy:
        src: "{{ java_service_base_dir }}/{{ java_service_jar_name }}"
        dest: "{{ java_service_base_dir }}/bak/app-{{ ansible_date_time.iso8601_basic_short }}.jar"
        remote_src: yes
        owner: "{{ java_service_user }}"
        group: "{{ java_service_group }}"
        mode: "0644"
      when: current_jar.stat.exists

    - name: Upload the new jar
      copy:
        src: "{{ backend_jar_src }}"
        dest: "{{ java_service_base_dir }}/{{ java_service_jar_name }}"
        owner: "{{ java_service_user }}"
        group: "{{ java_service_group }}"
        mode: "0644"

    - name: Create the managed content directory
      file:
        path: "{{ content_dest_dir }}"
        state: directory
        owner: "{{ java_service_user }}"
        group: "{{ java_service_group }}"
        mode: "0755"

    - name: Upload reviewed candidate content
      copy:
        src: "{{ content_source_dir }}/"
        dest: "{{ content_dest_dir }}/"
        owner: "{{ java_service_user }}"
        group: "{{ java_service_group }}"
        mode: "0644"
        directory_mode: "0755"

    - name: Import reviewed candidate content transactionally
      become_user: "{{ java_service_user }}"
      command:
        argv:
          - java
          - -jar
          - "{{ java_service_base_dir }}/{{ java_service_jar_name }}"
          - --spring.main.web-application-type=none
          - --content.import.enabled=true
          - --content.import.dry-run=false
          - "--content.import.directory={{ content_dest_dir }}"
          - "--content.import.source-revision={{ content_source_revision }}"
      environment:
        DATABASE_URL: "jdbc:postgresql://localhost:5432/{{ pg_app_db_name }}"
        DATABASE_USERNAME: "{{ pg_app_user }}"
        DATABASE_PASSWORD: "{{ lookup('env', 'PG_APP_USER_PASSWORD') }}"
      no_log: true

    - name: Restart the backend service
      systemd:
        name: "{{ java_service_name }}"
        state: restarted
        enabled: yes

    - name: Wait for the backend to listen on its port
      wait_for:
        host: 127.0.0.1
        port: 8080
        state: started
        timeout: 60
        delay: 3

    - name: Health check the API
      uri:
        url: "http://127.0.0.1:8080/api/candidates?size=1"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
